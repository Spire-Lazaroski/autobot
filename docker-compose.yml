# docker compose up -d --build     (keys from the panel's environment or a local .env next to this file)
services:
  autobot:
    build: .
    init: true                      # forwards the stop signal to the entrypoint, which stops the bot cleanly
    restart: unless-stopped
    stop_grace_period: 120s         # the bot needs time to close the trading jobs' positions on a stop
    environment:
      ALPACA_API_KEY: ${ALPACA_API_KEY:?set ALPACA_API_KEY (paper key)}
      ALPACA_SECRET_KEY: ${ALPACA_SECRET_KEY:?set ALPACA_SECRET_KEY (paper key)}
      PORT: ${PORT:-8080}
      STATE_DIR: /state
      AUTOSTART_BOT: ${AUTOSTART_BOT:-1}
    ports:
      # local to the server only: the lab has no login, so put it behind the panel's password / proxy
      - "127.0.0.1:${PORT:-8080}:${PORT:-8080}"
    volumes:
      - autobot_state:/state

volumes:
  autobot_state:
