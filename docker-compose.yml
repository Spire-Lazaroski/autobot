# The container for a hosting panel (NextDeploy) or `docker compose up -d --build`. No placeholders at all: the
# panel supplies the settings (ALPACA_API_KEY, ALPACA_SECRET_KEY, optional AUTOSTART_BOT) as environment variables;
# PORT 8080, STATE_DIR /state and AUTOSTART_BOT 0 are the image's defaults (Dockerfile).
services:
  app:
    build: .
    restart: unless-stopped
    stop_grace_period: 120s         # the bot needs time to close the trading jobs' positions on a stop
    healthcheck:                    # the lab answers on /health (no keys or account data)
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    expose:
      - "8080"                      # reached through the panel's proxy (the lab has no login of its own)
    environment:
      - ALPACA_API_KEY
      - ALPACA_SECRET_KEY
      - AUTOSTART_BOT
    volumes:
      - autobot_state:/state

volumes:
  autobot_state:
