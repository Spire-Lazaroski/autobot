# The container for a hosting panel (NextDeploy) or `docker compose up -d --build`. The only placeholder is the release tag the panel fills in: the
# panel injects its Environment settings (ALPACA_API_KEY, ALPACA_SECRET_KEY, optional AUTOSTART_BOT) itself;
# PORT 8080, STATE_DIR /state and AUTOSTART_BOT 0 are the image's defaults (Dockerfile).
services:
  app:
    image: autobot:${RELEASE_SHA}   # a local image, tagged with the release the panel deploys
    build: .
    restart: unless-stopped
    stop_grace_period: 120s         # the bot needs time to close the trading jobs' positions on a stop
    healthcheck:                    # the lab answers on /health (no keys or account data)
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    expose:
      - "8080"                      # reached through the panel's proxy (the lab has no login of its own)
    volumes:
      - autobot_state:/state

volumes:
  autobot_state:
