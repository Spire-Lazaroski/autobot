recalibration:
  mode: apply
  take_over_hand_made: true
  lookback_days: 90
  warmup_days: 30
  train_days: 20
  test_days: 5
  top_k: 3
  confirm_bars: 3
  allocation_pct: 10
  min_edge: 0.25
  min_trades: 10
  min_hold_days: 5
  max_changes_per_week: 1
  score_weights:
    sharpe: 1.0
    return: 0.5
    drawdown: 0.5
    turnover: 0.05
  costs:
    stock:
      fee_bps: 0.0
      slippage_bps: 2.0
    etf:
      fee_bps: 0.0
      slippage_bps: 2.0
    crypto:
      fee_bps: 25.0
      slippage_bps: 5.0
  exclude:
  - connors_rsi2
  - ibs_reversion
  - news_guard
  exclude_families_crypto:
  - intraday
universe:
  every_days: 7
  lookback_days: 20
  hysteresis: 2
  weights:
    dollar_volume: 0.5
    range_pct: 0.5
  min_dollar_volume: 1000000
  total:
    min: 10
    max: 20
  buckets:
    tech:
      min: 5
      max: 7
      candidates:
      - NVDA
      - AAPL
      - MSFT
      - AMZN
      - META
      - TSLA
      - AMD
      - SPCX
    index_etf:
      min: 2
      max: 2
      candidates:
      - QQQ
      - SPY
    commodity_etf:
      min: 2
      max: 3
      candidates:
      - USO
      - GLD
      - SLV
    health:
      min: 2
      max: 3
      candidates:
      - LLY
      - UNH
      - JNJ
      - ABBV
      - MRK
      - PFE
    staples:
      min: 2
      max: 3
      candidates:
      - WMT
      - COST
      - KO
      - PEP
      - PG
      - MCD
    crypto:
      min: 1
      max: 2
      min_dollar_volume: 0
      candidates:
      - BTC/USD
      - ETH/USD
