backtest:
  symbols:
  - SPY
  - QQQ
  - AAPL
  - NVDA
  - TSLA
  timeframe: 15Min
  days: 90
  rth_only: true
  fee_bps: 0.0
  slippage_bps: 2.0
  allow_short: false
  train_frac: 0.7
live:
  timeframe: 5Min
  poll_seconds: 5
  allow_short: false
  starting_note: paper only - live trading is disabled in code
  core:
    enabled: false
    symbol: VOO
    allocation_pct: 30
    rebalance_band_pct: 5
  risk:
    max_daily_loss_pct: 2.0
    max_position_usd: 10000
    max_gross_pct: 100
    flatten_before_close_min: 5
    sizing: fixed
    gross_budget_pct: 90
    bucket_max_pct:
      crypto: 20
    atr_days: 20
    profit_lock:
      enabled: false
      trigger_pct: 1.5
      giveback_pct: 50
  jobs:
  - name: trend
    strategy: ema_cross
    params:
      fast: 9
      slow: 21
    symbols:
    - SPY
    - QQQ
    allocation_pct: 20
    enabled: false
  - name: reversion
    strategy: rsi_reversion
    params:
      period: 7
      oversold: 20
      exit_level: 50
    symbols:
    - AAPL
    allocation_pct: 15
    enabled: false
  - name: crypto_breakout
    strategy: donchian_breakout
    params:
      entry: 20
      exit: 10
    symbols:
    - BTC/USD
    allocation_pct: 10
    enabled: false
  - name: auto_TSLA
    strategy: regime_switch
    params:
      trend_strategy: rsi_reversion
      range_strategy: vwap_reversion
      high_vol_strategy: flat
      confirm_bars: 3
      candidate_params:
        rsi_reversion:
          period: 7
          oversold: 30
          overbought: 70
          exit_level: 60
        vwap_reversion:
          band_pct: 0.5
    symbols:
    - TSLA
    allocation_pct: 10
    enabled: true
  - name: auto_USO
    strategy: regime_switch
    params:
      trend_strategy: momentum
      range_strategy: intraday_momentum
      high_vol_strategy: flat
      confirm_bars: 3
      candidate_params:
        momentum:
          lookback: 10
          threshold: 0.0
        intraday_momentum:
          signal_min: 30
          hold_min: 60
    symbols:
    - USO
    allocation_pct: 10
    enabled: true
  - name: auto_AAPL
    strategy: rsi_reversion
    params:
      period: 7
      oversold: 20
      exit_level: 50
    symbols:
    - AAPL
    allocation_pct: 10
    enabled: true
  - name: auto_SPY
    strategy: donchian_breakout
    params:
      entry: 40
      exit: 20
    symbols:
    - SPY
    allocation_pct: 10
    enabled: true
  - name: auto_QQQ
    strategy: regime_switch
    params:
      trend_strategy: noise_area
      range_strategy: rsi_reversion
      high_vol_strategy: flat
      confirm_bars: 3
      candidate_params:
        noise_area:
          lookback: 14
          band_mult: 1.2
        rsi_reversion:
          period: 14
          oversold: 10
          overbought: 70
          exit_level: 60
    symbols:
    - QQQ
    allocation_pct: 10
    enabled: true
