backtest:
  symbols:
  - SPY
  - QQQ
  - AAPL
  - NVDA
  - TSLA
  timeframe: 15Min
  days: 90
  rth_only: true
  fee_bps: 0.0
  slippage_bps: 2.0
  allow_short: false
  train_frac: 0.7
live:
  timeframe: 5Min
  poll_seconds: 5
  allow_short: false
  starting_note: paper only - live trading is disabled in code
  risk:
    max_daily_loss_pct: 2.0
    max_position_usd: 10000
    flatten_before_close_min: 5
    sizing: fixed
    gross_budget_pct: 90
    bucket_max_pct:
      crypto: 20
    atr_days: 20
  jobs:
  - name: trend
    strategy: ema_cross
    params:
      fast: 9
      slow: 21
    symbols:
    - SPY
    - QQQ
    allocation_pct: 20
    enabled: true
  - name: reversion
    strategy: rsi_reversion
    params:
      period: 7
      oversold: 20
      exit_level: 50
    symbols:
    - AAPL
    allocation_pct: 15
    enabled: true
  - name: crypto_breakout
    strategy: donchian_breakout
    params:
      entry: 20
      exit: 10
    symbols:
    - BTC/USD
    allocation_pct: 10
    enabled: false
news:
  symbols:
  - SPY
  - QQQ
  - AAPL
  - NVDA
  - TSLA
  earnings_dates:
    AAPL:
    - '2024-11-01'
    - '2025-01-31'
    - '2025-05-02'
    - '2025-08-01'
    - '2025-10-31'
    - '2026-01-30'
    - '2026-05-01'
    NVDA:
    - '2024-11-21'
    - '2025-02-27'
    - '2025-05-29'
    - '2025-08-28'
    - '2025-11-20'
    - '2026-02-26'
    - '2026-05-21'
    TSLA:
    - '2024-10-24'
    - '2025-01-30'
    - '2025-04-23'
    - '2025-07-24'
    - '2025-10-23'
    - '2026-01-29'
    - '2026-04-23'
recalibration:
  mode: apply
  take_over_hand_made: true
  lookback_days: 90
  warmup_days: 30
  train_days: 20
  test_days: 5
  top_k: 3
  confirm_bars: 3
  allocation_pct: 10
  min_edge: 0.25
  min_trades: 10
  min_hold_days: 5
  max_changes_per_week: 1
  score_weights:
    sharpe: 1.0
    return: 0.5
    drawdown: 0.5
    turnover: 0.05
  costs:
    stock:
      fee_bps: 0.0
      slippage_bps: 2.0
    etf:
      fee_bps: 0.0
      slippage_bps: 2.0
    crypto:
      fee_bps: 25.0
      slippage_bps: 5.0
  exclude:
  - connors_rsi2
  - ibs_reversion
  - news_guard
  exclude_families_crypto:
  - intraday
universe:
  every_days: 7
  lookback_days: 20
  hysteresis: 2
  weights:
    dollar_volume: 0.5
    range_pct: 0.5
  min_dollar_volume: 1000000
  total:
    min: 10
    max: 15
  buckets:
    tech:
      min: 5
      max: 6
      candidates:
      - NVDA
      - AAPL
      - MSFT
      - AMZN
      - META
      - TSLA
      - AMD
    index_etf:
      min: 2
      max: 2
      candidates:
      - QQQ
      - SPY
    commodity_etf:
      min: 2
      max: 3
      candidates:
      - USO
      - GLD
      - SLV
    crypto:
      min: 1
      max: 2
      min_dollar_volume: 0
      candidates:
      - BTC/USD
      - ETH/USD
