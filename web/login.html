<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a1a2e" />
    <meta name="robots" content="noindex" />
    <title>Sign in · Spire Analytics</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Spire" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%231a1a2e'/><stop offset='1' stop-color='%233a3a52'/></linearGradient></defs><polygon points='16,1.3 1.9,30.7 30.1,30.7' fill='url(%23g)'/><text x='16' y='28' text-anchor='middle' font-family='Manrope,sans-serif' font-weight='800' font-size='13' fill='%23e8b23d'>A</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <canvas id="scene" aria-hidden="true"></canvas>
    <main class="stage">
      <div class="wordmark" id="wordmark" aria-label="Spire Analytics">
        <span class="w-spire">SPIRE</span><span class="w-analytics">ANALYTICS</span>
      </div>
      <form class="card" id="login" autocomplete="on" novalidate>
        <h1>Sign in to the lab</h1>
        <label>User name<input id="user" name="username" autocomplete="username" required /></label>
        <label>Password<input id="password" name="password" type="password" autocomplete="current-password" required /></label>
        <label id="again-row" hidden>Password again<input id="password2" type="password" autocomplete="new-password" /></label>
        <p class="hint" id="hint" hidden>Your invite is valid for 7 days. User name: lower-case letters, digits, "." "_" or "-". Password: at least 12 characters.</p>
        <label class="remember"><input id="remember" type="checkbox" /> Keep me signed in on this device (30 days)</label>
        <button type="submit" id="go">Sign in</button>
        <p class="error" id="error" role="alert" hidden></p>
        <p class="foot">Paper trading lab · private · <a href="/terms">Terms</a> · <a href="/privacy">Privacy</a></p>
      </form>
    </main>
    <script type="module" src="/src/login/login.ts"></script>
  </body>
</html>
